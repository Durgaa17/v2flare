name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Cloudflare Deploy
        run: |
          response=$(curl -s -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/a7e02ac6-302f-4747-b0d0-60a767a664f8")
          
          if [ "${response: -3}" -ne 200 ]; then
            echo "Deployment failed with status: ${response: -3}"
            exit 1
          else
            echo "Deployment triggered successfully"
          fi
